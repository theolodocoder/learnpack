<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learn</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%23e2531f%27/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://i.ytimg.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" id="hl-light" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <link rel="stylesheet" id="hl-dark" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" disabled>
  <link rel="stylesheet" href="style.css">
  <script>
    window.LEARN_TOKEN = "__TOKEN__";
    try { const t = localStorage.getItem("theme"); if (t && t !== "system") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menu-btn" aria-label="Show course outline">☰</button>
    <div class="brand-wrap">
      <a class="brand" id="brand" href="#/">Learn</a>
      <div class="course-menu card" id="course-menu" role="menu" aria-label="Switch course" hidden></div>
    </div>
    <div class="grow"></div>
    <div class="topbar-progress" id="topbar-progress" hidden>
      <div class="lava-track"><div class="lava-fill" id="topbar-fill"></div></div>
      <span id="topbar-pct"></span>
    </div>
    <div class="timer" id="timer" hidden>
      <button class="timer-btn" id="timer-btn" aria-haspopup="dialog" aria-expanded="false" title="Focus timer">
        <span class="timer-dot" aria-hidden="true"></span><span id="timer-time">25:00</span>
      </button>
      <div class="timer-pop card" id="timer-pop" role="dialog" aria-label="Focus timer" hidden>
        <div class="tabs timer-phases">
          <button class="tab" data-phase="focus">Focus</button>
          <button class="tab" data-phase="short">Short break</button>
          <button class="tab" data-phase="long">Long break</button>
        </div>
        <div class="timer-big" id="timer-big">25:00</div>
        <div class="timer-actions">
          <button class="btn" id="timer-start">Start</button>
          <button class="btn ghost small" id="timer-reset">Reset</button>
          <button class="btn ghost small" id="timer-skip">Skip</button>
        </div>
        <div class="timer-settings">
          <label>Focus <input type="number" min="1" max="180" data-len="focus"></label>
          <label>Short <input type="number" min="1" max="60" data-len="short"></label>
          <label>Long <input type="number" min="1" max="90" data-len="long"></label>
          <span>min</span>
        </div>
        <p class="timer-meta" id="timer-meta"></p>
      </div>
    </div>
    <button class="icon-btn" id="focus-btn" title="Focus mode (F)" aria-pressed="false" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/><circle cx="12" cy="12" r="2.5"/></svg>
    </button>
    <button class="btn ghost small" id="notes-btn" hidden>Notes</button>
    <button class="icon-btn" id="theme-btn" aria-label="Switch theme"></button>
  </header>
  <div class="shell">
    <nav class="sidebar" id="sidebar" aria-label="Course outline"></nav>
    <main class="main" id="main" tabindex="-1"></main>
    <aside class="notes" id="notes" aria-label="Notes" hidden>
      <!-- List view: every note in this course -->
      <section class="nv-view" id="nv-list" hidden>
        <div class="nv-bar">
          <span></span>
          <button class="nv-tint nv-close" data-close aria-label="Close notes">Done</button>
        </div>
        <h2 class="nv-big">Notes</h2>
        <label class="nv-search"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/></svg>
          <input type="search" id="nv-search" placeholder="Search" aria-label="Search notes"></label>
        <div class="nv-items" id="nv-items"></div>
        <div class="nv-foot">
          <span></span><span id="nv-count"></span>
          <button class="nv-icon nv-tint" data-compose aria-label="New note" title="New note"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h6.5"/><path d="M18.4 3.6a2 2 0 0 1 2.9 2.9L12 15.8l-3.6.8.8-3.6z"/></svg></button>
        </div>
      </section>
      <!-- Note view -->
      <section class="nv-view" id="nv-note">
        <div class="nv-bar">
          <button class="nv-tint nv-back" id="nv-back"><svg viewBox="0 0 12 20" aria-hidden="true"><path d="M10 2 2 10l8 8"/></svg>Notes</button>
          <span class="nv-status" id="nv-status" role="status"></span>
          <button class="nv-tint nv-close" data-close aria-label="Close notes">Done</button>
        </div>
        <div class="nv-scroll">
          <div class="nv-date" id="nv-date"></div>
          <div class="nv-editor" id="nv-editor" contenteditable="true" spellcheck="true" aria-label="Note" data-placeholder="Start typing. The first line becomes the title."></div>
        </div>
        <div class="nv-format" id="nv-format" hidden>
          <div class="nv-styles">
            <button data-block="h1">Title</button><button data-block="h2">Heading</button><button data-block="h3">Subheading</button><button data-block="div">Body</button><button data-block="pre">Monostyled</button>
          </div>
          <div class="nv-row">
            <button data-cmd="bold" aria-label="Bold"><b>B</b></button><button data-cmd="italic" aria-label="Italic"><i>I</i></button><button data-cmd="underline" aria-label="Underline"><u>U</u></button><button data-cmd="strikeThrough" aria-label="Strikethrough"><s>S</s></button>
            <button data-cmd="insertUnorderedList" aria-label="Bulleted list">•≡</button><button data-cmd="insertOrderedList" aria-label="Numbered list">1≡</button>
          </div>
        </div>
        <div class="nv-tools">
          <button class="nv-icon nv-tint" id="nv-check" aria-label="Checklist" title="Checklist (⇧⌘L)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12.3 2.7 2.7L16 9.5"/></svg></button>
          <button class="nv-icon nv-tint nv-aa" id="nv-aa" aria-label="Text format" title="Text format" aria-expanded="false">Aa</button>
          <button class="nv-icon nv-tint" id="nv-delete" aria-label="Delete note" title="Delete note"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
          <button class="nv-icon nv-tint" data-compose aria-label="New note" title="New note"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h6.5"/><path d="M18.4 3.6a2 2 0 0 1 2.9 2.9L12 15.8l-3.6.8.8-3.6z"/></svg></button>
        </div>
      </section>
    </aside>
  </div>
  <!-- In-app browser: links open here instead of new tabs -->
  <section class="browser-panel" id="browser" aria-label="Link viewer" hidden>
    <div class="browser-resize" id="br-resize" role="separator" aria-orientation="vertical" aria-label="Resize the link viewer" tabindex="0" title="Drag to resize"></div>
    <div class="browser-bar">
      <button class="icon-btn" id="br-back" aria-label="Back" title="Back" disabled>‹</button>
      <button class="icon-btn" id="br-fwd" aria-label="Forward" title="Forward" disabled>›</button>
      <button class="icon-btn" id="br-reload" aria-label="Reload" title="Reload">↻</button>
      <div class="browser-address" title="">
        <span class="browser-title" id="br-title"></span>
        <span class="browser-url" id="br-url"></span>
      </div>
      <span class="browser-mode" id="br-mode" hidden title="This site doesn't allow being shown inside other pages, so you're seeing a reading copy without its scripts">Reading copy</span>
      <a class="icon-btn browser-ext" id="br-ext" href="#" target="_blank" rel="noopener" aria-label="Open in your browser" title="Open in your browser">↗</a>
      <button class="icon-btn" id="br-close" aria-label="Close" title="Close (Esc)">✕</button>
    </div>
    <div class="browser-body">
      <iframe id="br-frame" title="Link viewer" referrerpolicy="no-referrer"></iframe>
      <div class="browser-state" id="br-state" hidden></div>
    </div>
  </section>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="study.js"></script>
  <script src="local.js"></script>
  <script src="runner.js"></script>
  <script src="app.js"></script>
</body>
</html>
